<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fahad Enterprise Transport Management System</title>
<style>
:root{color-scheme:dark;--bg:#0a1330;--bg2:#13204d;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--tx:#f4f7ff;--mu:#9fb0d4;--ac:#c9d4ea;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx);background:radial-gradient(1200px 700px at 80% -10%,#24387a 0,transparent 60%),linear-gradient(160deg,var(--bg),#050a1c);min-height:100vh}
#app{display:flex;min-height:100vh}
nav{width:220px;padding:16px 12px;background:rgba(5,10,28,.7);backdrop-filter:blur(14px);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{font-weight:800;letter-spacing:.5px;color:#fff;margin:4px 8px 16px;line-height:1.2}.logo small{display:block;color:var(--mu);font-weight:500;font-size:11px}
nav a{display:block;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:3px;transition:.2s}
nav a:hover,nav a.on{background:linear-gradient(90deg,rgba(201,212,234,.2),transparent);color:#fff;transform:translateX(3px)}
main{flex:1;padding:20px;min-width:0}
h1{font-size:22px;margin:0 0 14px}h3{margin:0 0 10px;font-size:15px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{transition:.3s;transform-style:preserve-3d}.stat:hover{transform:perspective(600px) rotateX(6deg) translateY(-4px)}
.stat b{display:block;font-size:20px;margin-top:4px}.stat span{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button,select,input,textarea{font:inherit;color:var(--tx);background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
button{cursor:pointer;background:linear-gradient(180deg,#3b5bb5,#25398a);border:0;transition:.2s}button:hover{filter:brightness(1.2);transform:translateY(-1px)}
button.s{background:rgba(255,255,255,.1)}button.d{background:#8b2a2a}
select option{background:#13204d}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:140px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.tag{padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.12);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal>div{background:#101a40;border:1px solid var(--bd);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fm label{display:block;font-size:12px;color:var(--mu)}.fm input,.fm select{width:100%;margin-top:3px}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99;background:linear-gradient(rgba(5,10,28,.72),rgba(5,10,28,.9)),var(--lg,none) center 30%/cover,var(--bg)}#login .card{width:min(360px,92%)}#login input{width:100%;margin:6px 0}
.stage{height:230px;perspective:900px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tr{position:relative;width:0;height:0;transform-style:preserve-3d;transform:scale(.62) rotateX(-12deg) rotateY(30deg);animation:sp 16s linear infinite}
.tr b,.tr i{position:absolute;left:0;top:0;transform-style:preserve-3d}.tr i{border:1px solid rgba(0,0,0,.3)}
@keyframes sp{to{transform:scale(.62) rotateX(-12deg) rotateY(390deg)}}
svg text{fill:var(--mu);font-size:10px}
.stage3{position:relative;height:300px;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#2a4290 0,#0a1330 72%)}.stage3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.ov{position:absolute;left:16px;top:12px;z-index:2;pointer-events:none}.ov b{display:block;letter-spacing:2px;font-size:15px}.ov span{color:var(--mu);font-size:12px}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.gal img{height:210px;border-radius:14px;scroll-snap-align:start;border:1px solid var(--bd);cursor:pointer;transition:.3s;box-shadow:0 10px 24px rgba(0,0,0,.4)}.gal img:hover{transform:perspective(700px) rotateY(-7deg) scale(1.03)}
.ban{height:130px;border-radius:16px;background-size:cover;background-position:center 45%;display:flex;flex-direction:column;justify-content:center;padding:0 18px;margin-bottom:14px;border:1px solid var(--bd)}.ban b{font-size:18px;letter-spacing:1.5px}.ban span{color:var(--ac);font-size:12px}
.ai{background:linear-gradient(160deg,rgba(8,16,48,.85),rgba(0,0,0,.7));border-color:rgba(70,130,255,.5);box-shadow:0 0 40px rgba(47,123,255,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.orbbox{height:170px;margin:-6px 0 4px}.orbbox canvas{width:100%!important;height:100%!important;display:block}
.orbcss{width:110px;height:110px;margin:20px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fbaff,#2f7bff 45%,#0b2c8f);box-shadow:0 0 40px #2f7bff;animation:pl 2s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.08)}}
.msgs{height:260px;overflow-y:auto;padding:4px}.m{max-width:90%;padding:9px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}.m.u{background:#2a4fd6;margin-left:auto}.m.b{background:rgba(255,255,255,.08);border:1px solid var(--bd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.chips button{white-space:nowrap;font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;z-index:60;font-size:26px;padding:0;background:radial-gradient(circle at 35% 30%,#8fbaff,#2f7bff 50%,#0b2c8f);box-shadow:0 0 26px #2f7bff}.fab.on,.on#mic{animation:pl 1s infinite}
.toast{position:fixed;left:12px;right:84px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;display:none;background:rgba(10,19,48,.96);border:1px solid rgba(70,130,255,.6);border-radius:16px;padding:12px;max-height:45vh;overflow:auto;white-space:pre-wrap;box-shadow:0 0 30px rgba(47,123,255,.3)}.toast small{color:var(--mu);display:block;margin-bottom:4px}
.wk{position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;font-size:12px;padding:6px 12px;border-radius:99px;background:rgba(10,19,48,.92);border:1px solid var(--bd)}.wk.wkon{border-color:#4ade80;box-shadow:0 0 14px rgba(74,222,128,.5)}
.pill{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media(max-width:800px){#app{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}.logo{display:none}nav a{white-space:nowrap;margin:0 4px 0 0}main{padding:12px}.g2,.fm{grid-template-columns:1fr}}
@media print{nav,.bar,button{display:none!important}body{background:#fff;color:#000}.card{background:#fff;border-color:#999;box-shadow:none}th,td,h1,h3{color:#000}}
</style></head><body>

const NUM=['freight','diesel','other','amount','salary'],REF=['truck','driver','customer'];

function rep(){const p=Q.rp||'monthly',d=Q.rd||today();const len={daily:10,monthly:7,yearly:4}[p],key=d.slice(0,len);
const f=flows().filter(x=>(x.d||'').startsWith(key)),i=f.reduce((a,x)=>a+x.i,0),e=f.reduce((a,x)=>a+x.e,0);
const by=(k,c)=>[...new Set(f.map(x=>x[k]).filter(Boolean))].map(id=>{const g=f.filter(x=>x[k]==id),a=g.reduce((s,x)=>s+x.i,0),b=g.reduce((s,x)=>s+x.e,0);return[esc(lab(c,id)),R(a),R(b),pf(a-b)]});
const T=by('tr','trucks'),C=by('cu','customers');window._x=[['Truck','Income','Expenses','Profit'],...T.map(r=>r.map(v=>String(v).replace(/<[^>]+>/g,''))),[],['Customer','Income','Expenses','Profit'],...C.map(r=>r.map(v=>String(v).replace(/<[^>]+>/g,'')))].map(r=>r.join('\t')).join('\n');
return`<h1>Reports</h1><div class="bar"><select onchange="Q.rp=this.value;go('reports')">${['daily','monthly','yearly'].map(x=>`<option ${x==p?'selected':''}>${x}</option>`).join('')}</select><input type="date" value="${d}" onchange="Q.rd=this.value;go('reports')"><button onclick="print()">PDF / Print</button><button class="s" onclick="navigator.clipboard.writeText(window._x).then(()=>alert('Copied. Paste into Excel.'),()=>alert('Clipboard blocked'))">Copy for Excel</button></div>
<div class="card"><h3>Fahad Enterprise — ${p} report (${key})</h3><p>Income ${R(i)} · Expenses ${R(e)} · Profit/Loss ${pf(i-e)}</p></div>
<div class="card"><h3>Truck-wise profit</h3>${tb(['Truck','Income','Expenses','Profit'],T)}</div><div class="card"><h3>Customer-wise</h3>${tb(['Customer','Income','Expenses','Profit'],C)}</div>`}
// ---------- GPS
const gst=x=>{const g=DB.gps[x.id];if(!g||!g.time)return{t:'GPS offline',c:'#f87171'};if(Date.now()-new Date(g.time)>15*60000)return{t:'GPS offline (stale)',c:'#f87171'};return+g.speed>3?{t:'Moving '+Math.round(g.speed)+' km/h',c:'#4ade80'}:{t:'Stopped',c:'#fbbf24'}};
function gps(){const c=DB.cfg;return`<h1>Live GPS Tracking</h1><div class="g2"><div class="card"><svg id="map" viewBox="0 0 360 300" width="100%" style="background:rgba(255,255,255,.04);border-radius:12px"></svg><small style="color:var(--mu)">Schematic Pakistan map. Markers appear only from real device data.</small></div>
<div class="card"><h3>Trucks</h3>${DB.trucks.map(x=>{const g=gst(x),p=DB.gps[x.id],h=(p&&p.hist)||[];return`<p><span class="pill" style="background:${g.c}"></span><b>${esc(x.reg)}</b> — ${g.t}<br><small style="color:var(--mu)">${p&&p.time?'Last update: '+new Date(p.time).toLocaleString()+' · '+(+p.lat).toFixed(4)+', '+(+p.lng).toFixed(4)+(h.length>1?' · route '+h[0].lat.toFixed(3)+','+h[0].lng.toFixed(3)+' → '+h[h.length-1].lat.toFixed(3)+','+h[h.length-1].lng.toFixed(3):''):'No location data received'}${x.dev?'':' · no GPS Device ID set'}</small></p>`}).join('')||'No trucks.'}</div></div>
<div class="card"><h3>GPS provider integration</h3><div class="fm"><label>Provider name<input id="gp" value="${esc(c.prov)}"></label><label>Positions API endpoint (your secure backend/proxy)<input id="gu" value="${esc(c.url)}" placeholder="https://…"></label><label>API key / token<input id="gk" type="password" value="${esc(c.key)}"></label></div>
<p><button onclick="gsave()">Save settings</button> <button class="s" onclick="gsync()">Sync now</button></p>
<label style="color:var(--mu)">Or paste positions JSON exported from provider: [{"deviceId":"…","lat":31.5,"lng":74.3,"speed":40,"time":"ISO"}]<textarea id="gj" rows="3" style="width:100%"></textarea></label><p><button class="s" onclick="gingest(JSON.parse(\$('#gj').value||'[]'))">Import positions</button></p></div>`}
function drawMap(){const X=l=>(l-60)/18*360,Y=l=>(37-l)/14*300;const o='61.6,25.2 66.7,25.4 68.1,23.7 71.1,24.4 71,27.8 74.6,29.9 75.2,32.3 74.5,34.5 77,35.6 75.5,37 72.5,36.8 71.3,36 71.6,34.5 69.9,33 70.3,31.3 66.4,29.8 62.5,29.4';
let s=`<polygon points="${o.split(' ').map(p=>{const[a,b]=p.split(',');return X(a)+','+Y(b)}).join(' ')}" fill="rgba(201,212,234,.1)" stroke="#c9d4ea"/>`;
[['Karachi',67,24.86],['Lahore',74.35,31.55],['Islamabad',73.05,33.68],['Quetta',66.99,30.18],['Peshawar',71.57,34]].forEach(c=>s+=`<circle cx="${X(c[1])}" cy="${Y(c[2])}" r="2" fill="#9fb0d4"/><text x="${X(c[1])+4}" y="${Y(c[2])+3}">${c[0]}</text>`);
DB.trucks.forEach(t=>{const g=DB.gps[t.id];if(!g||!g.time||isNaN(g.lat))return;const h=g.hist||[];if(h.length>1)s+=`<polyline fill="none" stroke="#3b5bb5" stroke-width="2" points="${h.map(p=>X(p.lng)+','+Y(p.lat)).join(' ')}"/>`;const st=gst(t);s+=`<circle cx="${X(g.lng)}" cy="${Y(g.lat)}" r="6" fill="${st.c}" stroke="#fff"/><text x="${X(g.lng)+8}" y="${Y(g.lat)-6}" style="fill:#fff;font-weight:700">${esc(t.reg)}</text>`});
$('#map').innerHTML=s}
function gsave(){DB.cfg={prov:$('#gp').value,url:$('#gu').value,key:$('#gk').value};save();alert('GPS settings saved')}
function gingest(a){if(!Array.isArray(a))a=a.positions||[];let n=0;a.forEach(p=>{const t=DB.trucks.find(x=>x.dev&&x.dev==(p.deviceId||p.id||p.imei));if(!t||isNaN(+p.lat)||isNaN(+p.lng))return;const g=DB.gps[t.id]||{hist:[]};g.hist=(g.hist||[]).concat({lat:+p.lat,lng:+p.lng,time:p.time}).slice(-500);Object.assign(g,{lat:+p.lat,lng:+p.lng,speed:+p.speed||0,time:p.time||new Date().toISOString()});DB.gps[t.id]=g;n++});save();go('gps');alert(n+' position(s) matched to trucks by GPS Device ID')}
async function gsync(){gsave();if(!DB.cfg.url)return alert('Enter the provider/proxy endpoint first');try{const r=await fetch(DB.cfg.url,{headers:{Authorization:'Bearer '+DB.cfg.key}});if(!r.ok)throw 0;gingest(await r.json())}catch(e){alert('Could not reach GPS endpoint. Trucks stay marked GPS offline. Cross-site requests need your secure backend proxy.')}}
</script></body></html>
